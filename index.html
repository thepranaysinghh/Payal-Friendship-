<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payal ✨</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff9ad5,#8aa7ff);
background-size:200% 200%;
animation:bgMove 15s ease infinite alternate;
}

@keyframes bgMove{
0%{background-position:0% 50%}
100%{background-position:100% 50%}
}

/* emoji background */
.emoji{
position:fixed;
font-size:22px;
pointer-events:none;
opacity:.9;
animation:fall linear forwards;
z-index:0;
}
@keyframes fall{
0%{transform:translateY(-10vh)}
100%{transform:translateY(110vh)}
}

/* door */
.door{
width:160px;height:240px;
background:#8b4513;
border-radius:15px;
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
cursor:pointer;
transition:.8s;
z-index:10;
}
.door.open{
transform:translate(-50%,-50%) rotateY(85deg);
opacity:0;
}

/* card */
.card{
display:none;
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%) scale(.9);
padding:40px;
width:85%;
max-width:500px;
text-align:center;
background:rgba(255,255,255,.25);
backdrop-filter:blur(18px);
border-radius:22px;
box-shadow:0 0 60px rgba(255,255,255,.35);
transition:.5s ease;
z-index:20;
}

.card.show{
display:block;
}

/* popup lines */
.line{
opacity:0;
animation:fade .6s forwards;
}
@keyframes fade{to{opacity:1}}

button{
margin-top:20px;
padding:12px 28px;
border:none;
border-radius:20px;
background:rgba(255,255,255,.6);
font-weight:bold;
cursor:pointer;
}

/* gift */
.gift{
font-size:90px;
cursor:pointer;
animation:float 3s infinite ease-in-out;
}
@keyframes float{
50%{transform:translateY(-12px)}
}
</style>
</head>

<body>

<div class="door" id="door"></div>

<div class="card" id="scene1">
<h2>Pata hai Payal! Tum kon ho ?</h2>
<button onclick="next(2)">Tap to know ki kon ho tum</button>
</div>

<div class="card" id="scene2">
<h2>Tum woh ho jiske baare main Shah Rukh Khan ne bohot phle hi bata diya thaa</h2>
<button onclick="next(3)">Accha Kyaa bata diya thaa</button>
</div>

<div class="card" id="scene3">
<h2 id="dialogue"></h2>
<button onclick="next(4)">Tap to know ki kon ho tum</button>
</div>

<div class="card" id="scene4">
<h2>Kon ho tum ye toh main baad main bataunga , phle tum ye batao zara</h2>
<button onclick="next(5)">Kyaa</button>
</div>

<div class="card" id="scene5">
<div class="gift" onclick="next(6)">🎁</div>
</div>

<div class="card" id="scene6">
<h2>
Woh main ye keh raha thaa ki 😌<br><br>
Agar Bura naa maano toh 👉👈<br><br>
Payal Aap Mujhse.....<br><br>
Dosti Karogi 🤌🎀
</h2>

<button onclick="yesClick()">YES</button>
<button id="noBtn">NO</button>
</div>

<script>

/* door */
const door=document.getElementById("door");
door.onclick=()=>{
door.classList.add("open");
setTimeout(()=>show(1),700);
};

/* scenes */
function show(n){
document.querySelectorAll(".card").forEach(c=>c.classList.remove("show"));
document.getElementById("scene"+n).classList.add("show");
if(n===3) showDialogue();
}

function next(n){
show(n);
}

/* dialogue animation */
function showDialogue(){
const lines=[
"Kehte hain Ki....",
"Kisi Chiz ko Shiddat se Chaho!",
"Toh poori Qayanat use...",
"Tumse milaane ki Koshish Main lag jaati hai"
];

const d=document.getElementById("dialogue");
d.innerHTML="";
lines.forEach((t,i)=>{
setTimeout(()=>{
let div=document.createElement("div");
div.className="line";
div.innerText=t;
d.appendChild(div);
},i*600);
});
}

/* NO button move */
const noBtn=document.getElementById("noBtn");
function moveNo(){
noBtn.style.position="fixed";
noBtn.style.left=Math.random()*(window.innerWidth-100)+"px";
noBtn.style.top=Math.random()*(window.innerHeight-50)+"px";
}
noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("click",moveNo);

/* HEART RAIN FINAL */
function yesClick(){

let count=0;

const interval=setInterval(()=>{

for(let i=0;i<8;i++){
let heart=document.createElement("div");
heart.className="emoji";
heart.innerText=["💖","❤️","💕","💗","💓","💞","💘"]
[Math.floor(Math.random()*7)];

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*30)+"px";
heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
}

count++;
if(count>25) clearInterval(interval);

},150);

}

/* light background emojis */
setInterval(()=>{
if(document.querySelectorAll('.emoji').length>10)return;
let e=document.createElement("div");
e.className="emoji";
e.innerText=["✨","🌸","💖"][Math.floor(Math.random()*3)];
e.style.left=Math.random()*100+"vw";
document.body.appendChild(e);
setTimeout(()=>e.remove(),6000);
},1500);

</script>

</body>
</html>
