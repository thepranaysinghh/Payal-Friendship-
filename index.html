<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payal ✨</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff9ad5,#8aa7ff);
background-size:200% 200%;
animation:bgMove 15s ease infinite alternate;
}

@keyframes bgMove{
0%{background-position:0% 50%}
100%{background-position:100% 50%}
}

/* emoji rain */
.emoji{
position:fixed;
font-size:24px;
animation:fall linear infinite;
pointer-events:none;
}
@keyframes fall{
0%{transform:translateY(-10vh)}
100%{transform:translateY(110vh)}
}

/* glass card */
.card{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(.8);
opacity:0;
padding:40px;
width:85%;
max-width:500px;
text-align:center;
background:rgba(255,255,255,.2);
backdrop-filter:blur(18px);
border-radius:22px;
box-shadow:0 0 60px rgba(255,255,255,.35);
transition:.6s ease;
}

.card.show{
opacity:1;
transform:translate(-50%,-50%) scale(1);
}

/* popup lines */
.line{
opacity:0;
transform:translateY(20px);
animation:lineEnter .6s forwards;
}

@keyframes lineEnter{
to{opacity:1;transform:translateY(0)}
}

button{
margin-top:20px;
padding:12px 28px;
border:none;
border-radius:20px;
background:rgba(255,255,255,.5);
font-weight:bold;
cursor:pointer;
}

/* door */
.door{
width:160px;
height:240px;
background:#8b4513;
border-radius:15px;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,.3);
transition:.8s;
}
.door.open{
transform:translate(-50%,-50%) rotateY(85deg);
opacity:0;
}

/* gift */
.gift{
font-size:90px;
cursor:pointer;
animation:float 3s ease-in-out infinite;
}
@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-14px)}
}
</style>
</head>

<body>

<div class="door" id="door"></div>

<div class="card" id="scene1">
<h2>Pata hai Payal! Tum kon ho ?</h2>
<button onclick="next(2)">Tap to know ki kon ho tum</button>
</div>

<div class="card" id="scene2">
<h2>Tum woh ho jiske baare main Shah Rukh Khan ne bohot phle hi bata diya thaa</h2>
<button onclick="next(3)">Accha Kyaa bata diya thaa</button>
</div>

<div class="card" id="scene3">
<h2 id="dialogue"></h2>
<button onclick="next(4)">Tap to know ki kon ho tum</button>
</div>

<div class="card" id="scene4">
<h2>Kon ho tum ye toh main baad main bataunga , phle tum ye batao zara</h2>
<button onclick="next(5)">Kyaa</button>
</div>

<div class="card" id="scene5">
<div class="gift" onclick="next(6)">🎁</div>
</div>

<div class="card" id="scene6">
<h2>
Woh main ye keh raha thaa ki 😌<br><br>
Agar Bura naa maano toh 👉👈<br><br>
Payal Aap Mujhse.....<br><br>
Dosti Karogi 🤌🎀
</h2>

<button onclick="yesClick()">YES</button>
<button id="noBtn">NO</button>
</div>

<script>

const door=document.getElementById("door");
door.onclick=()=>{
door.classList.add("open");
setTimeout(()=>show(1),700);
};

function show(n){
document.getElementById("scene"+n).classList.add("show");
if(n===3) showDialogue();
}

function next(n){
document.querySelectorAll(".card").forEach(c=>c.classList.remove("show"));
show(n);
}

/* LINE BY LINE POPUP */
function showDialogue(){
const lines=[
"Kehte hain Ki....",
"Kisi Chiz ko Shiddat se Chaho!",
"Toh poori Qayanat use...",
"Tumse milaane ki Koshish Main lag jaati hai"
];

const container=document.getElementById("dialogue");
container.innerHTML="";

lines.forEach((text,i)=>{
setTimeout(()=>{
let div=document.createElement("div");
div.className="line";
div.innerText=text;
container.appendChild(div);
},i*600);
});
}

/* NO BUTTON FULL SCREEN MOVE */
const noBtn=document.getElementById("noBtn");

noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("click",moveNo);

function moveNo(){
const maxX=window.innerWidth-noBtn.offsetWidth;
const maxY=window.innerHeight-noBtn.offsetHeight;

noBtn.style.position="fixed";
noBtn.style.left=Math.random()*maxX+"px";
noBtn.style.top=Math.random()*maxY+"px";
}

/* hearts */
function yesClick(){
for(let i=0;i<30;i++){
let e=document.createElement("div");
e.className="emoji";
e.innerText="💖";
e.style.left=Math.random()*100+"vw";
e.style.animationDuration=(3+Math.random()*3)+"s";
document.body.appendChild(e);
}
}

/* emoji rain */
setInterval(()=>{
let e=document.createElement("div");
e.className="emoji";
e.innerText=["💖","✨","🌸","⭐"][Math.floor(Math.random()*4)];
e.style.left=Math.random()*100+"vw";
e.style.animationDuration=(5+Math.random()*5)+"s";
document.body.appendChild(e);
setTimeout(()=>e.remove(),8000);
},600);

</script>

</body>
</html>
